<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080b" />
    <meta name="description" content="OcWave: a minimalist music player that keeps your library on your device." />
    <title>OcWave</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="assets/logo.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OcWave" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var mode = localStorage.getItem("ocwave.mode");
        var light = mode === "light" || (mode !== "dark" && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n>Skip to content</a>
    <div class="ambient" aria-hidden="true"></div>
    <div class="splash" aria-hidden="true">
      <img src="assets/logo.svg" alt="" />
      <div class="eq-logo"><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="app">
      <nav class="rail" aria-label="Main" data-i18n-attr="aria-label">
        <a class="logo" href="#/" aria-label="OcWave home" data-i18n-attr="aria-label"><img src="assets/logo.svg" alt="" /></a>
        <a class="nav-link" data-route="home" href="#/"><span class="ms">home</span><span data-i18n>Home</span></a>
        <a class="nav-link" data-route="search" href="#/search"><span class="ms">search</span><span data-i18n>Search</span></a>
        <a class="nav-link" data-route="library" href="#/library"><span class="ms">library_music</span><span data-i18n>Library</span></a>
        <a class="nav-link" data-route="player" href="#/player"><span class="ms">play_circle</span><span data-i18n>Player</span></a>
        <span class="spacer"></span>
        <a class="nav-link" data-route="settings" href="#/settings"><span class="ms">settings</span><span data-i18n>Settings</span></a>
      </nav>
      <header class="topbar" aria-hidden="true"><span class="topbar-title"></span></header>
      <main id="main" class="main" tabindex="-1"></main>
      <div id="mini" class="mini"></div>
    </div>
    <noscript><p style="padding:2rem">OcWave needs JavaScript to run.</p></noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
