# Builds the desktop installers (macOS .dmg and Windows .exe) and attaches them to a GitHub Release.
# Run it by pushing a version tag:   git tag v1.0.0 && git push origin v1.0.0
# or manually from the "Actions" tab ("Run workflow"), which only produces downloadable build artifacts.
# The installers are not code-signed (see README), the file names stay the same for every release so the
# "Download" buttons in Settings can point at .../releases/latest/download/<name>.
name: Desktop builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing certificate: build unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: ocwave-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
